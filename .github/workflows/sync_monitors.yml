name: Sync UptimeRobot Monitors

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 10:00 CST (02:00 UTC)
  workflow_dispatch:
    inputs:
      cpu_type_filter:
        description: 'Filter servers by CPU type (amd64, arm64, or all)'
        required: false
        type: choice
        options:
          - all
          - amd64
          - arm64
        default: all

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.matrix.outputs.servers }}
      server_count: ${{ steps.matrix.outputs.server_count }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Build server matrix
        id: matrix
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          EXTRA_HOSTS_CONFIG_URL: ${{ secrets.EXTRA_HOSTS_CONFIG_URL }}
          CPU_TYPE_FILTER: ${{ github.event.inputs.cpu_type_filter || 'all' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests

          url = os.environ["HOSTS_CONFIG_URL"]
          response = requests.get(url, timeout=15)
          response.raise_for_status()
          servers = response.json()

          # Merge extra hosts config (now also a JSON server list)
          extra_url = os.environ.get("EXTRA_HOSTS_CONFIG_URL")
          if extra_url:
              try:
                  extra_resp = requests.get(extra_url, timeout=15)
                  extra_resp.raise_for_status()
                  extra_servers = extra_resp.json()
                  if isinstance(extra_servers, list):
                      seen = {s.get("name") for s in servers if isinstance(s, dict) and s.get("name")}
                      for s in extra_servers:
                          if isinstance(s, dict) and s.get("ssh_host") and s.get("name") not in seen:
                              seen.add(s.get("name"))
                              servers.append(s)
              except Exception as e:
                  print(f"Failed to fetch extra config: {e}")

          cpu_type_filter = os.environ.get("CPU_TYPE_FILTER", "all")

          matrix = []
          for index, server in enumerate(servers, start=1):
              name = server.get("name")
              ssh_host = server.get("ssh_host")
              if not name or not ssh_host:
                  continue

              cpu_type = server.get("cpu_type", "amd64")

              # Skip hosts using direct transport (no Cloudflare Access SSH)
              if server.get("transport") == "direct":
                  print(f"Skipping {name}: transport=direct")
                  continue

              # Apply CPU type filter if specified
              if cpu_type_filter != "all" and cpu_type != cpu_type_filter:
                  continue

              slug = re.sub(r"[^A-Za-z0-9._-]+", "-", name).strip("-").lower() or f"server-{index}"
              matrix.append({
                  "index": index,
                  "name": name,
                  "cpu_type": cpu_type,
                  "ssh_host": ssh_host,
                  "result_file": f"{index:03d}-{slug}.json"
              })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"servers={json.dumps(matrix, ensure_ascii=True)}\n")
              fh.write(f"server_count={len(matrix)}\n")
          PY

  collect:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.servers) }}
    name: Collect ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Setup Cloudflared Binaries
        run: |
          chmod +x bin/cloudflared-linux-amd64
          ls -l bin/

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Collect server IPs
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          AMD64_SSH_USERNAME: ${{ secrets.AMD64_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          # Cloudflare Access service tokens, one per SSH zone (hhwpxh.com / 555606.xyz).
          CF_ACCESS_ID_HHWPXH: ${{ secrets.CF_ACCESS_ID_HHWPXH }}
          CF_ACCESS_SECRET_HHWPXH: ${{ secrets.CF_ACCESS_SECRET_HHWPXH }}
          CF_ACCESS_ID_555606: ${{ secrets.CF_ACCESS_ID_555606 }}
          CF_ACCESS_SECRET_555606: ${{ secrets.CF_ACCESS_SECRET_555606 }}
          SERVER_NAME: ${{ matrix.name }}
          SERVER_CPU_TYPE: ${{ matrix.cpu_type }}
          SERVER_SSH_HOST: ${{ matrix.ssh_host }}
          RESULT_PATH: collected/${{ matrix.result_file }}
        run: |
          mkdir -p collected
          if ! python sync_monitors.py collect \
            --name "$SERVER_NAME" \
            --cpu-type "$SERVER_CPU_TYPE" \
            --ssh-host "$SERVER_SSH_HOST" \
            --output "$RESULT_PATH"; then
            python -c 'import json, os; path = os.environ["RESULT_PATH"]; os.makedirs(os.path.dirname(path), exist_ok=True); payload = {"name": os.environ["SERVER_NAME"], "cpu_type": os.environ["SERVER_CPU_TYPE"], "ssh_host": os.environ["SERVER_SSH_HOST"], "ipv4": None, "ipv6": None, "status": "failed"}; open(path, "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")'
          fi

      - name: Push collected result to blog repo
        if: ${{ always() }}
        env:
          BLOG_REPO_PAT: ${{ secrets.BLOG_REPO_PAT }}
          RESULT_FILE: ${{ matrix.result_file }}
        run: |
          git clone "https://x-access-token:${BLOG_REPO_PAT}@github.com/suwei8/blog.git" blog-data
          cd blog-data
          git config user.name "uptimerobot-sync"
          git config user.email "uptimerobot-sync@users.noreply.github.com"
          if git fetch --depth 1 origin ip-collect:ip-collect; then
            git checkout ip-collect
          else
            git checkout -b ip-collect
          fi
          mkdir -p collected
          cp "../collected/${RESULT_FILE}" "collected/${RESULT_FILE}"
          git add "collected/${RESULT_FILE}"
          git commit -m "collect: ${{ matrix.name }}"
          if ! git push origin ip-collect; then
            git pull --rebase origin ip-collect
            git push origin ip-collect
          fi

  aggregate:
    needs:
      - prepare
      - collect
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Name of the IP inventory file written into the private blog repo.
      # Renamed from the leaked HOSTS_IP.txt; change it here only.
      IP_LIST_FILE: internal-notes.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download collected results from blog repo
        env:
          BLOG_REPO_PAT: ${{ secrets.BLOG_REPO_PAT }}
        run: |
          mkdir -p collected-results
          git clone "https://x-access-token:${BLOG_REPO_PAT}@github.com/suwei8/blog.git" blog-data
          cd blog-data
          git config user.name "uptimerobot-sync"
          git config user.email "uptimerobot-sync@users.noreply.github.com"
          if git fetch origin ip-collect:ip-collect; then
            git checkout ip-collect
            cp collected/*.json ../collected-results/ 2>/dev/null || echo "No collected JSON files on ip-collect branch"
          else
            echo "ip-collect branch not found; continuing with empty results"
          fi

      - name: Run aggregate sync
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          EXTRA_HOSTS_CONFIG_URL: ${{ secrets.EXTRA_HOSTS_CONFIG_URL }}
          CF_555606_XYZ_MAIN_API_KEY: ${{ secrets.CF_555606_XYZ_MAIN_API_KEY }}
          XINJIAPO_555606_XYZ_MAIN_API_KEY: ${{ secrets.XINJIAPO_555606_XYZ_MAIN_API_KEY }}
          CF_555606_XYZ_STATUS_PAGE_ID: ${{ secrets.CF_555606_XYZ_STATUS_PAGE_ID }}
          CF_555606_XYZ_STATUS_PAGE_URL_KEY: ${{ secrets.CF_555606_XYZ_STATUS_PAGE_URL_KEY }}
          XINJIAPO_555606_XYZ_STATUS_PAGE_ID: ${{ secrets.XINJIAPO_555606_XYZ_STATUS_PAGE_ID }}
          XINJIAPO_555606_XYZ_STATUS_PAGE_URL_KEY: ${{ secrets.XINJIAPO_555606_XYZ_STATUS_PAGE_URL_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_RULESET_ID: ${{ secrets.CLOUDFLARE_RULESET_ID }}
          CLOUDFLARE_RULE_ID: ${{ secrets.CLOUDFLARE_RULE_ID }}
          CLOUDFLARE_RULE_DESCRIPTION: ${{ secrets.CLOUDFLARE_RULE_DESCRIPTION }}
          CLOUDFLARE_RULE_EXPRESSION_TEMPLATE: ${{ secrets.CLOUDFLARE_RULE_EXPRESSION_TEMPLATE }}
        run: |
          python sync_monitors.py aggregate --results-dir collected-results --ip-output "$IP_LIST_FILE"

      - name: Commit IP list to blog repo
        if: ${{ always() }}
        run: |
          cd blog-data
          DEFAULT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||')
          if [ -z "$DEFAULT_BRANCH" ]; then
            # Fallback for clones without refs/remotes/origin/HEAD; force the C locale so
            # the "HEAD branch:" marker is not translated.
            DEFAULT_BRANCH=$(LC_ALL=C git remote show origin | sed -n 's/.*HEAD branch: //p')
          fi
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Unable to determine the blog repo default branch" >&2
            exit 1
          fi
          git checkout "$DEFAULT_BRANCH"
          # The previous file name leaked; drop it from the blog repo if it is still tracked.
          if git ls-files --error-unmatch HOSTS_IP.txt >/dev/null 2>&1; then
            git rm -q HOSTS_IP.txt
            echo "Removed leaked HOSTS_IP.txt from $DEFAULT_BRANCH"
          fi
          if [ -f "../$IP_LIST_FILE" ]; then
            cp "../$IP_LIST_FILE" "./$IP_LIST_FILE"
            git add "$IP_LIST_FILE"
          else
            echo "$IP_LIST_FILE was not generated; skipping content update"
          fi
          if git diff --cached --quiet; then
            echo "No IP list changes to commit"
          else
            git commit -m "Update $IP_LIST_FILE"
            git push origin "$DEFAULT_BRANCH"
          fi
          git push origin --delete ip-collect || true
